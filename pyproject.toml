[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kis-mcp-doc"
version = "0.1.0"
description = "KIS governed knowledge and deterministic documentation generation"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[project.scripts]
kis-doc = "kis_mcp_doc.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
