name: Canonical Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'kis-readonly-queue/main/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-verification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact head
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"
      KIS_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KIS_EXACT_SHA }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Prepare canonical repository path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\Projects\kis-mcp-doc | Out-Null
          Get-ChildItem -Force | Where-Object Name -ne '.venv' | Copy-Item -Destination C:\Projects\kis-mcp-doc -Recurse -Force
          $Actual = (git -C C:\Projects\kis-mcp-doc rev-parse HEAD).Trim().ToLowerInvariant()
          if ($Actual -ne $env:KIS_EXACT_SHA.ToLowerInvariant()) {
            throw "EXACT_HEAD_MISMATCH: expected $env:KIS_EXACT_SHA, checked out $Actual"
          }

      - name: Synchronize locked environment once
        shell: pwsh
        working-directory: C:\Projects\kis-mcp-doc
        run: uv sync --locked --all-groups

      - name: Run canonical repository verification
        shell: pwsh
        working-directory: C:\Projects\kis-mcp-doc
        run: pwsh -NoProfile -File scripts/verify.ps1 -SkipDependencySync
