name: Documentation Release Assets

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  attach:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Verify governed documentation release
        run: pwsh -NoProfile -File scripts/verify.ps1 -SkipDependencySync
      - name: Attach deterministic documentation assets
        shell: pwsh
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            generated/documentation-release/documentation-site.zip `
            generated/documentation-release/release-metadata.json `
            --repo "${{ github.repository }}" `
            --clobber
